services:
  headless-oxider:
    container_name: headless-oxider
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-harianto}/headless-oxider:1.1.1
    ports:
      - "${RUST_FETCH_HOST_PORT:-9381}:9381"
    environment:
      RUST_FETCH_PORT: "${RUST_FETCH_PORT:-9381}"
      RUST_FETCH_HOST: "0.0.0.0"
      CHROME_PATH: /usr/bin/chromium
      STEALTH: "${STEALTH:-1}"
      HEADFUL: "${HEADFUL:-0}"
      FINGERPRINT_PROFILE: "${FINGERPRINT_PROFILE:-native}"
      PROXY_URL: "${PROXY_URL:-}"
      BLOCKLIST_PATH: /etc/headless-oxider/blocklist.txt
      SESSIONS_DIR: /var/lib/headless-oxider/sessions
    volumes:
      - oxider-sessions:/var/lib/headless-oxider/sessions
    shm_size: "1gb"
    restart: unless-stopped

  # Headful under Xvfb — less “headless Chrome” surface. Usage:
  #   docker compose --profile headful up -d
  headless-oxider-headful:
    profiles: ["headful"]
    container_name: headless-oxider-xvfb
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-harianto}/headless-oxider:1.1.1
    ports:
      - "${RUST_FETCH_HOSTFUL_PORT:-9382}:9381"
    environment:
      RUST_FETCH_PORT: "9381"
      RUST_FETCH_HOST: "0.0.0.0"
      CHROME_PATH: /usr/bin/chromium
      STEALTH: "${STEALTH:-1}"
      HEADFUL: "1"
      FINGERPRINT_PROFILE: "${FINGERPRINT_PROFILE:-native}"
      PROXY_URL: "${PROXY_URL:-}"
      BLOCKLIST_PATH: /etc/headless-oxider/blocklist.txt
      SESSIONS_DIR: /var/lib/headless-oxider/sessions
    volumes:
      - oxider-sessions:/var/lib/headless-oxider/sessions
    shm_size: "1gb"
    # xvfb-run as PID 1 hangs on SIGUSR1 readiness in Docker; start Xvfb ourselves.
    entrypoint:
      - sh
      - -c
      - |
        Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
        export DISPLAY=:99
        i=0
        while [ $$i -lt 50 ]; do
          [ -S /tmp/.X11-unix/X99 ] && break
          i=$$((i + 1))
          sleep 0.1
        done
        exec headless-oxider

    restart: unless-stopped

volumes:
  oxider-sessions:
