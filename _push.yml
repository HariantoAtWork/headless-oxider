# docker compose -f _push.yml build --no-cache --push
# Multi-arch cannot be loaded into the local Docker engine; use _build.yml for local images.
services:
  headless-oxider:
    build:
      context: .
      dockerfile: Dockerfile.platform
      platforms:
        - linux/amd64
        - linux/arm64
    image: harianto/headless-oxider:1.2.0
