[package]
name = "headless-rust"
version = "1.1.1"
edition = "2021"
description = "Stealth Chromium fetch service (Rust + chaser-oxide)"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
chaser-oxide = "0.2"
futures = "0.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
